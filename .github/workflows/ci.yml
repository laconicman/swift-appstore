name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "Upstream/**", ".devin/**", ".github/*.md", ".github/*.yml"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "Upstream/**", ".devin/**", ".github/*.md", ".github/*.yml"]

# A superseded PR push cancels the run it replaces — review rounds push several commits an
# hour, and a queue of stale runs is what the 2026-09-24 quota exhaustion looked like.
# Never on main: two merges a minute apart delivered their push events out of order and the
# older commit's run cancelled the newer one's (2026-09-29), leaving HEAD unverified.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Offline only: the build plugin generates the client from the vendored spec, and every test
# runs against a mock transport with a throwaway P-256 key. No App Store Connect credentials
# exist in this workflow and no request leaves the runner. Prose-only changes skip the three
# runners (paths-ignore above); with no required-checks ruleset that costs nothing.
jobs:
  linux:
    name: Build & test (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-jammy
    steps:
      - uses: actions/checkout@v5
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  macos:
    name: Build & test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  spec-pin:
    name: Vendored spec matches its manifest
    runs-on: ubuntu-latest
    container: swift:6.1-jammy
    steps:
      - uses: actions/checkout@v5
      # Re-normalizes the vendored document in place without a network fetch and fails if the
      # pinned sha256 or counts in spec-manifest.json would change.
      - name: Re-pin offline
        run: |
          swift run asc-spec-tool --no-fetch
          # The checkout is owned by a different uid than the container's git runs as.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --stat --exit-code -- Sources/AppStoreOpenAPI/openapi.json Sources/AppStoreOpenAPI/spec-manifest.json
